<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turing Machine Visualizer</title>
<style>

                   background:var(--panel); color:var(--fg); border:1px solid var(--line); cursor:pointer; }

  label { color:var(--muted); font-size:.8rem; }

<body><div class="wrap">

<h1>Turing Machine Visualizer</h1>
<p class="sub">A C++ visualizer compiled to WebAssembly. Same engine as the desktop build &mdash;
only the graphics backend differs.</p>

<div class="bar">
  <label for="prog">Program</label>
  <select id="prog"></select>
  <button id="restart">Restart</button>
  <button id="pause">Pause</button>
</div>

<div id="wrapCanvas"><canvas id="canvas" width="1503" height="819"></canvas></div>
<div id="status">Loading WebAssembly&hellip;</div>
<p class="hint">Speed is the slider inside the canvas, bottom right. Press <kbd>P</kbd> to toggle
the state-signature display.</p>

<script>
  const statusEl = document.getElementById('status');
  const canvas   = document.getElementById('canvas');
  const sel      = document.getElementById('prog');

  // Assigned once the wasm factory resolves. C++ main() runs *during* module
  // init -- before that promise settles -- so nothing may touch this until then.
  let Module = null;
  let paused = false;

  window.tvBooted = () => {};                       // fires too early to be useful
  window.tvReady  = () => { statusEl.className = ''; statusEl.textContent = 'Running \u2014 ' + sel.value; };
  window.tvStopped = (m) => { statusEl.className = ''; statusEl.textContent =
      'Stopped: ' + m + ' \u2014 press Restart or pick another program.'; };
  window.tvError  = (m) => { statusEl.className = 'err'; statusEl.textContent = 'Error: ' + m; };

  Object.keys(PROGRAMS).forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });

  function start() {
    if (!Module) return;
    // Speed is owned by the slider inside the canvas; this is just the start value.
    Module.ccall('tv_load', null, ['string', 'number'], [PROGRAMS[sel.value], 100]);
    paused = false;
    document.getElementById('pause').textContent = 'Pause';
  }

  document.getElementById('restart').onclick = start;
  sel.onchange = start;
  document.getElementById('pause').onclick = () => {
    if (!Module) return;
    paused = !paused;
    Module.ccall('tv_set_paused', null, ['number'], [paused ? 1 : 0]);
    document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
  };

  // graphics.h polls its own event queue, so the page just pushes into it.
  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.round((e.clientX - r.left) * (canvas.width  / r.width)),
      y: Math.round((e.clientY - r.top)  * (canvas.height / r.height)),
    };
  }
  canvas.addEventListener('mousedown', e => {
    if (!Module) return;
    const p = canvasPos(e);
    Module.ccall('tv_push_mouse', null, ['number','number','number','number'], [1, p.x, p.y, 1]);
  });
  window.addEventListener('mouseup', e => {
    if (!Module) return;
    const p = canvasPos(e);
    Module.ccall('tv_push_mouse', null, ['number','number','number','number'], [1, p.x, p.y, 0]);
  });
  window.addEventListener('keydown', e => {
    if (!Module || e.key.length !== 1) return;
    Module.ccall('tv_push_key', null, ['number','number'], [e.key.charCodeAt(0), 1]);
  });
</script>
